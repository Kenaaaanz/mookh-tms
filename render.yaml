services:
  - type: web
    name: mookh-ticket-system
    env: python
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput --clear
    startCommand: gunicorn mookh_system.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mookh-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHON_VERSION
        value: 3.10.11
    plan: free

databases:
  - name: mookh-db
    plan: free
    databaseName: mookh
    user: mookh_user
services:
  - type: web
    name: mookh_system
    env: python
    region: oregon  # or your preferred region
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py migrate --noinput
      python manage.py collectstatic --noinput --clear
    startCommand: gunicorn mookh_system.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: PYTHON_VERSION
        value: 3.10.11
    autoDeploy: true
    plan: free

databases:
  - name: mookh_tms
    plan: free
    databaseName: postgres
    user: postgres